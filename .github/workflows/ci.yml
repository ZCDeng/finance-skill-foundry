# Linux checks on every pushed branch. Same-repo pull requests show these
# checks too, so there is no separate pull_request trigger to run them twice.
#
# Tests that need the macOS isolated runner, the frozen foundry/Formulator
# binaries or a packaged app skip themselves here; packaging, signing and the
# desktop Playwright scripts (tools/verify_*.cjs) stay on the release Mac.
name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The pyproject floor and the version development runs on.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Plugin, probe and tool-contract tests run the JavaScript sources with node.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  app:
    name: App (Vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      # Tests mock Electron; the binary is only needed to launch the app.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Report-editor tests round-trip workbooks through the Python engine.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e "..[dev]"
      - run: npm ci --no-audit --no-fund
      # Stages the pinned DSH runtime into extra/dsh; the client-adapter and
      # embedded-client tests read its stock sources.
      - run: npm run harness
      - run: npx vitest run
      # Type-checks renderer and main process, then bundles.
      - run: npm run build
