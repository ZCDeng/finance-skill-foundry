appId: com.foundry.finance-skill-foundry
productName: FA Foundry
afterPack: scripts/check-packaged-bundle.cjs
directories:
  output: release
  buildResources: build

files:
  - dist-electron/**
  - dist-vite/**
  - package.json
  # Source maps point at a tree the buyer does not have. `sourceMap` stays on in
  # `tsconfig.electron.json` because `npm run dev:electron` uses the same config
  # and wants them; they just do not ship.
  - '!dist-electron/**/*.js.map'

# Chromium ships its own localisation, tens of megabytes of `.pak` files for
# languages this product does not offer. The interface is Chinese; English stays
# because the harness's own strings are in it.
electronLanguages:
  - zh-CN
  - en-US

# The runtime rides beside the asar rather than inside it. Not a size decision:
# it resolves its own modules from real directories, which is why upstream sets
# `asar: false` for its own build. Staging it here lets this app keep asar
# packing for its own code.
#
# `extra/dsh` is produced by `npm run harness` and is not in version control.
# `npm run package` checks for it first and stops, because packaging without it
# produces an app whose workbench never starts and says nothing about why.
extraResources:
  - from: src/assets/fonts/noto-sans-sc
    to: fonts
    filter:
      - 'NotoSansSC-report.ttf'
      - 'report-font.json'
      - 'OFL.txt'
  # The figure font's license travels with the app (OFL §2). The renderer bundles its own copy of the WOFF2 faces;
  # these are for report exports (HTML/PDF embed the WOFF2, Word embeds the TTF).
  - from: src/assets/fonts/ibm-plex-mono
    to: fonts/ibm-plex-mono
    filter:
      - 'OFL.txt'
      - 'manifest.json'
      - '*.woff2'
      - 'IBMPlexMono-Regular.ttf'
  # The brand face's license (OFL §2). Vite carries the WOFF2 faces into the
  # archive but not the license: the `/*!` comment in `fonts.css` does not survive
  # minification, so without this file 0.10.1 shipped Asap Sharp unlicensed.
  - from: src/assets/fonts/asap-sharp
    to: fonts/asap-sharp
    filter:
      - 'OFL.txt'
  # `node_modules` is named on its own line. electron-builder skips a directory
  # by that name inside extraResources unless it is asked for explicitly, and the
  # failure is quiet: the bundle builds, `dsh/` arrives holding only the pin
  # file, and the workbench never starts on a machine with no staged tree to fall
  # back on.
  - from: extra/dsh/node_modules
    to: dsh/node_modules
    filter:
      - '**/*'
      # Nothing key-shaped leaves this machine inside the bundle.
      - '!**/.env'
      - '!**/.env.*'
      - '!**/*_API_KEY*'
      # What the runtime needs is the compiled JavaScript. The rest is what a
      # publish leaves beside it.
      #
      # Source maps: read only when a stack trace is being symbolicated, and a
      # missing one degrades that trace rather than failing.
      - '!**/*.map'
      # The vendor's TypeScript beside its own compiled output. The DeepSeek
      # packages export a `./src/*` subpath, but no `main`, `module` or
      # `exports` entry point in the tree resolves to a `.ts`, and nothing in
      # the compiled output requires a `/src/` path.
      - '!**/*.ts'
      - '!**/*.tsx'
      - '!**/*.mts'
      - '!**/*.cts'
      # Type declarations. Consumed by `tsc`, never at run time.
      - '!**/*.d.ts'
      - '!**/*.d.mts'
      - '!**/*.d.cts'
      # The compiler's incremental-build scratch: file hashes and a dependency
      # graph for a machine that is not the buyer's.
      - '!**/*.tsbuildinfo'
      # node-pty publishes prebuilt binaries for every platform in one package.
      # This app is Apple Silicon only (`mac.target` below); the Intel, Linux and
      # Windows ones are dead weight, and the Intel pair were the only x86_64
      # Mach-O files in 0.10.1.
      - '!**/node-pty/prebuilds/darwin-x64/**'
      - '!**/node-pty/prebuilds/linux-*/**'
      - '!**/node-pty/prebuilds/win32-*/**'
      # And the Windows console host it vendors beside them.
      - '!**/node-pty/third_party/**'
  # The pin, so an installed app can say which runtime it carries.
  - from: extra/dsh
    to: dsh
    filter:
      - 'PIN'
  # The native conversation loads the same offline font as the React shell.
  - from: extra/dsh/assets/fonts
    to: dsh/assets/fonts
    filter:
      - 'NotoSansSC-variable.woff2'
  # And that font's license beside it (OFL §2).
  - from: src/assets/fonts/noto-sans-sc
    to: dsh/assets/fonts
    filter:
      - 'OFL.txt'
  # The frozen `foundry` CLI. The app shells out to it for every read and for the
  # wiring steps, so without it a packed build only works where the kit is
  # already installed.
  #
  # No filters. This tree is a PyInstaller one-dir bundle: an interpreter, a
  # native DuckDB extension and the packaged resources, and every part of it is
  # load-bearing. The `.ts`/`.map` trimming that suits the harness tree would
  # take real files out of this one.
  - from: extra/foundry
    to: foundry
    filter:
      - '**/*'
      - '!**/.DS_Store'

  # The frozen Data Formulator. Same reasoning as the CLI: an interpreter, its
  # own native extensions and a 30MB built frontend, all of it load-bearing.
  #
  # It carries `foundry` as well. `DF_PLUGIN_DIR` names a loose `.py` that Data
  # Formulator imports by path, and a frozen app ignores PYTHONPATH -- so that
  # file's own imports resolve only from inside this bundle.
  - from: extra/formulator
    to: formulator
    filter:
      - '**/*'
      - '!**/.DS_Store'

  # The period bundle, as a real directory. The harness's own copy lives in
  # `dsh/node_modules/finance-skill-foundry-dsh`; this one is what each harness
  # profile symlinks to, and a symlink cannot point inside an archive. No package
  # manager runs on the buyer's machine (see `electron/harness/wiring.ts`).
  - from: ../dsh-plugin
    to: dsh-plugin
    filter:
      - '**/*'
      - '!node_modules'
      - '!**/.DS_Store'

mac:
  category: public.app-category.finance
  # Not under `build/`, the default buildResources: the root `.gitignore` drops
  # every `build/` directory, and an icon left there never reaches a clean
  # checkout. Without one the bundle ships Electron's own.
  icon: resources/icon.icns
  # Apple Silicon only, named rather than inherited from the build host: a build
  # run from an x64 Node under Rosetta would otherwise produce an x64 shell
  # around arm64 Python bundles. `scripts/check-packaged-bundle.cjs` asserts every
  # Mach-O file in the result is arm64.
  target:
    - target: dir
      arch:
        - arm64
  # `npm run package` stays unsigned so any machine can build; first open goes through
  # right-click → Open. The release build signs and notarizes instead:
  #   CSC_NAME="<Name> (<TEAMID>)" npm run package:signed   # no "Developer ID Application:" prefix
  #   NOTARY_PROFILE=<notarytool keychain profile> npm run notarize
  # package:signed adds the hardened runtime, signing/entitlements.mac.plist and
  # signing/sign-macho-only.cjs (signs Mach-O files only; see that file for why).
  identity: null
