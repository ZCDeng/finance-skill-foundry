[project]
name = "finance-skill-foundry"
version = "0.1.0"
description = "Finance manager skill foundry: lock a period catalog, emit a tagged brief"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # 1.5.5 is the current stable line; 1.6 exists only as .dev prereleases on
  # PyPI. The floor is the exact release the READ_ONLY attach path is verified
  # against, so a fresh install cannot land on an older 1.5.x.
  "duckdb>=1.5.5,<1.6",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]
# The locked-catalog loader subclasses data_formulator's ExternalDataLoader, so
# the binding is version-bound, not just documented in the README.
formulator = ["data-formulator==0.7.0"]

[project.scripts]
foundry = "foundry.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["foundry*", "formulator-plugin*"]

[tool.setuptools.package-data]
foundry = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
