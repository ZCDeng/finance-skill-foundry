name: finance-skill-foundry
runtime: typescript
entry: ./src/index.ts
tools:
  - import
  - lock
  - record-questions
  - emit-brief
  - launch-formulator
  - query-locked
  - re-import
profiles:
  period:
    sandbox: read-only
    cwd_writable: false
    omit:
      - bash
      - dsh-tool-fs
      - str-replace-editor
    tools:
      - import
      - lock
      - record-questions
      - emit-brief
      - launch-formulator
      - query-locked
      - re-import
  f3:
    sandbox: read-only
    tools:
      - query-locked
    deny_paths:
      - catalog.duckdb
      - formulator
